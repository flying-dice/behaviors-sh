stages:
  - check
  - test
  - docs
  - deploy
  - release
  - mirror

# ---- Reused pieces -----------------------------------------------------------

.bun:
  image: oven/bun:latest
  before_script:
    - bun install --frozen-lockfile

# ---- Stage: check ------------------------------------------------------------

# Biome — formatter + linter, runs in CI mode so any deviation from
# the committed formatting or any lint error fails the pipeline.
biome:
  extends: .bun
  stage: check
  script:
    - bun run lint:ci

# TypeScript typechecks across every backend workspace package. Catches
# the cross-package regressions a single-package `tsc --noEmit` misses.
typecheck:
  extends: .bun
  stage: check
  script:
    - bunx tsc --noEmit -p packages/spec/tsconfig.json
    - bunx tsc --noEmit -p packages/runtime/tsconfig.json
    - bunx tsc --noEmit -p packages/cli/tsconfig.json
    - bunx tsc --noEmit -p packages/dsl/tsconfig.json

# ---- Stage: test -------------------------------------------------------------

# `bun test` walks every package's tests/ folder (spec, runtime, cli).
test:
  extends: .bun
  stage: test
  script:
    - bun test

# Bundle the CLI for Node + smoke-test the resulting dist on a real
# Node runtime. This is the artifact we'd publish to npm, so we
# verify it boots without Bun-only globals leaking in. The smoke test
# uses `--version` because it's the cheapest entry that still touches
# the full import graph.
cli:build:
  extends: .bun
  stage: test
  script:
    - bun --filter @behaviors-sh/cli build
    - apt-get update -qq && apt-get install -y -qq nodejs
    - node packages/cli/dist/index.js --version
  artifacts:
    paths:
      - packages/cli/dist
    expire_in: 1 day

# ---- Stage: docs -------------------------------------------------------------

# Verify that the docs build succeeds. Keeps the dist as an artifact for
# the `pages` job in the deploy stage to publish on main.
docs:build:
  extends: .bun
  stage: docs
  script:
    - bun run docs:build
  artifacts:
    paths:
      - docs/.vitepress/dist
    expire_in: 1 day
    when: always

# ---- Stage: deploy -----------------------------------------------------------

# GitLab Pages publishes whatever ends up in `public/` after this job
# runs. We rename the vitepress dist so we don't duplicate the build.
pages:
  extends: .bun
  stage: deploy
  needs:
    - job: docs:build
      artifacts: true
  script:
    - mv docs/.vitepress/dist public
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ---- Stage: release ----------------------------------------------------------

# semantic-release: computes the next version from conventional commit
# messages, updates CHANGELOG.md, bumps the three publishable
# package.json files, builds + publishes @behaviors-sh/{spec,dsl,cli}
# to npm, commits the version+changelog back to the repo, and creates
# a GitHub release with the generated notes.
#
# Manual-only (click ▶ on `release` from the main pipeline view) so
# nothing slips out unintentionally. Requires two CI/CD variables:
#
#   NPM_TOKEN     — masked + protected. npm "Automation" token scoped
#                   to the @behaviors-sh org. `bun publish` reads it
#                   from .npmrc.
#   GITHUB_TOKEN  — masked + protected. GitHub PAT (or fine-grained
#                   token) with `contents: write` on
#                   flying-dice/behaviors-sh. Used to push the
#                   release commit + tag and to create the GitHub
#                   release via the API.
#
# Origin is rewritten to GitHub for the release run so the tag lands
# alongside the existing mirror, keeping `npm` package homepages and
# GitHub release URLs consistent.
release:
  extends: .bun
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
    - when: never
  before_script:
    - apt-get update -qq && apt-get install -y -qq git ca-certificates
    - git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/flying-dice/behaviors-sh.git"
    - bun install --frozen-lockfile
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
  script:
    - bunx semantic-release

# ---- Stage: mirror -----------------------------------------------------------

# Replicate main → github.com/flying-dice/behaviors-sh via SSH. Uses a
# per-project deploy key stored as the protected file CI/CD variable
# `GITHUB_MIRROR_SSH_KEY`; matched against a write-enabled deploy key on
# the GitHub side. `git push --mirror` keeps refs + tags in sync so the
# GitHub repo always represents the GitLab head.
mirror:github:
  image:
    name: alpine/git:latest
    # `alpine/git` runs `git` as its entrypoint; override so the
    # shell can run our multi-line script verbatim.
    entrypoint: [""]
  stage: mirror
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    # Disable the default clone — we set up our own with the mirror remote.
    GIT_STRATEGY: none
  script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$GITHUB_MIRROR_SSH_KEY" ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t rsa,ed25519,ecdsa github.com >> ~/.ssh/known_hosts 2>/dev/null
    - git clone --mirror "$CI_REPOSITORY_URL" repo.git
    - cd repo.git
    - git remote add github git@github.com:flying-dice/behaviors-sh.git
    - git push --mirror github
